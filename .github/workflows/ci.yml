name: VAYUWISE AI CI

on:
  push:
    branches: [ main, security/dependency-upgrade ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 3001

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22.x LTS
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Verified Dependencies
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/security/dependency-upgrade" ]; then
            rm -f package-lock.json
            npm install --package-lock-only --ignore-scripts
          fi
          npm ci

      - name: Dependency Security Audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          let report;
          try {
            report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          } catch {
            console.log('Dependency audit did not return valid JSON. Check npm registry connectivity.');
            process.exit(0);
          }
          console.log('Dependency advisory totals:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, advisory] of Object.entries(report.vulnerabilities ?? {})) {
            const titles = (advisory.via ?? [])
              .filter(item => typeof item === 'object')
              .map(item => item.title)
              .join('; ');
            console.log(`[${advisory.severity}] ${name} | direct=${advisory.isDirect} | range=${advisory.range} | fix=${JSON.stringify(advisory.fixAvailable)} | ${titles}`);
          }
          NODE
          npm audit --omit=dev --json > npm-audit-production.json || true
          node <<'NODE'
          const fs = require('node:fs');
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'));
            console.log('Production dependency advisory totals:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, advisory] of Object.entries(report.vulnerabilities ?? {})) {
              const via = (advisory.via ?? []).map(item => typeof item === 'string' ? item : item.title).join('; ');
              console.log(`[${advisory.severity}] ${name} | direct=${advisory.isDirect} | range=${advisory.range} | fix=${JSON.stringify(advisory.fixAvailable)} | ${via}`);
            }
          } catch {
            console.log('Production dependency audit did not return JSON. Check npm registry connectivity.');
          }
          NODE

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Static Code Analysis & Linting (Oxlint)
        run: npm run lint

      - name: Unit & Integration Test Suite
        run: npm run test:run

      - name: Coverage Verification
        run: npm run test:coverage

      - name: Full Client & Server Production Build
        run: npm run build

      - name: Commit verified dependency lockfile
        if: github.ref == 'refs/heads/security/dependency-upgrade'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): refresh lockfile for audited package upgrades"
            git push
          else
            echo "package-lock.json already matches package.json"
          fi

